          .no-print { display: none !important; }
        }
        .header-bar {
          background: #18412a;
          color: white;
          font-size: 18px;
          font-weight: 900;
          text-align: center;
          padding: 8px 10px;
          letter-spacing: 0.3px;
          border: 1.5px solid #000;
          border-bottom: none;
        }
        .filter-row {
          display: flex;
          align-items: flex-end;
          gap: 8px;
          padding: 6px 8px;
          background: white;
          border-left: 1.5px solid #000;
          border-right: 1.5px solid #000;
          border-top: 1.5px solid #000;
          border-bottom: 1.5px solid #000;
        }
        .filter-item { display: flex; flex-direction: column; gap: 2px; }
        .filter-item label {
          font-size: 13px;
          font-weight: 900;
          line-height: 1;
          color: #000;
        }
        .filter-item input, .filter-item select {
          border: 1px solid #000;
          height: 32px;
          font-size: 13px;
          font-weight: 700;
          padding: 0 6px;
          background: white;
          color: black;
          outline: none;
          border-radius: 0;
        }
        .filter-school { flex: 1.2; min-width: 0; }
        .filter-class { width: 92px; }
        .filter-subject { width: 128px; }
        .filter-year { width: 88px; }
        .filter-total { width: 48px; }

        .cce-table {
          width: 100%;
          table-layout: fixed;
          border-collapse: collapse;
          border: 1.5px solid #000;
        }
        .cce-table th, .cce-table td {
          border: 1.5px solid #000;
          height: 36px;
          text-align: center;
          padding: 0 2px;
          box-sizing: border-box;
          overflow: hidden;
        }
        .cce-table th {
          line-height: 1.1;
        }
        .row1 th { font-size: 16px; font-weight: 900; }
        .row2 th { font-size: 14px; font-weight: 900; }

        .sl-header, .name-header { background: #f1f1f1; }
        .fa-header { background: #b6d7a8; }
        .sa-header { background: #ffd966; }
        .sem-header { background: #9fc5e8; }
        .total-header { background: #d9d9d9; }

        .fa-sub-marks { background: #fff; }
        .fa-sub-weight { background: #d9ead3; }
        .fa-sub-grade { background: #b6d7a8; }
        .sa-sub-marks { background: #fff; }
        .sa-sub-weight { background: #fff2cc; }
        .sa-sub-grade { background: #ffd966; }
        .sem-sub-total { background: #fff; }
        .sem-sub-grade { background: #cfe2f3; }
        .total-sub-total { background: #fff; }
        .total-sub-grade { background: #efefef; }

        .sl-cell { background: #fbfbfb; font-size: 15px; font-weight: 900; }
        .name-cell { background: white; text-align: left !important; padding-left: 4px !important; }
        .name-input {
          width: 100%;
          height: 32px;
          border: none;
          outline: none;
          font-size: 15px;
          font-weight: 700;
          background: transparent;
          color: black;
          padding: 0 2px;
        }
        .marks-cell { background: white; padding: 1px !important; }
        .pct-fa { background: #d9ead3; font-size: 15px; font-weight: 400; }
        .grade-fa { background: #b6d7a8; font-size: 15px; font-weight: 400; }
        .pct-sa { background: #fff2cc; font-size: 15px; font-weight: 400; }
        .grade-sa { background: #ffd966; font-size: 15px; font-weight: 400; }
        .sem-cell { background: white; font-size: 15px; font-weight: 400; }
        .sem-grade { background: #cfe2f3; font-size: 15px; font-weight: 400; }
        .total-cell { background: white; font-size: 15px; font-weight: 700; }
        .total-grade { background: #efefef; font-size: 15px; font-weight: 700; }

        .mark-wrap {
          display: flex;
          flex-direction: row;
          width: 100%;
          height: 34px;
          align-items: stretch;
        }
        .mark-input {
          width: calc(100% - 22px);
          height: 100%;
          border: none;
          outline: none;
          text-align: center;
          font-size: 16px;
          font-weight: 400;
          color: black;
          background: white;
          padding: 0;
          margin: 0;
        }
        .spinner-col {
          width: 22px;
          height: 100%;
          display: flex;
          flex-direction: column;
          opacity: 1 !important;
          border-left: 1px solid #000;
        }
        .spinner-btn {
          flex: 1;
          width: 100%;
          border: none;
          background: #f1f1f1;
          font-size: 9px;
          line-height: 1;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
          user-select: none;
        }
        .spinner-btn:first-child { border-bottom: 1px solid #000; }
        .spinner-btn:hover { background: #e0e0e0; }
        .spinner-btn:active { background: #d0d0d0; }

        .shake { animation: shake 0.35s ease-in-out; }
        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          20% { transform: translateX(-4px); }
          40% { transform: translateX(4px); }
          60% { transform: translateX(-3px); }
          80% { transform: translateX(3px); }
        }

        .buttons-bar {
          background: #eeeeee;
          border-left: 1.5px solid #18412a;
          border-right: 1.5px solid #18412a;
          border-bottom: 1.5px solid #18412a;
          border-top: none;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 6px 8px;
          justify-content: flex-start;
        }
        .btn {
          height: 36px;
          font-size: 13px;
          font-weight: 900;
          color: white;
          border: none;
          padding: 0 16px;
          cursor: pointer;
          border-radius: 3px;
          letter-spacing: 0.2px;
        }
        .btn-add { background: #2e7d32; }
        .btn-reset { background: #ff9800; }
        .btn-export { background: #1565c0; }
        .btn:hover { filter: brightness(1.1); }
        .status-msg { font-size: 13px; font-weight: 700; color: #18412a; margin-left: 8px; }

        .footer-bar {
          background: #18412a;
          color: white;
          font-size: 13px;
          font-weight: 700;
          text-align: center;
          padding: 6px 10px;
          border: 1.5px solid #000;
          border-top: none;
          margin-top: auto;
        }

        .popup-overlay {
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.35);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
        }
        .popup-box {
          width: 360px;
          background: white;
          border: 2px solid #000;
          box-shadow: 0 6px 24px rgba(0,0,0,0.35);
        }
        .popup-head {
          background: #c62828;
          color: white;
          font-weight: 900;
          font-size: 14px;
          padding: 8px 12px;
          text-align: center;
        }
        .popup-body {
          padding: 14px 16px;
          font-size: 13px;
          font-weight: 700;
          color: #000;
          line-height: 1.4;
          text-align: center;
        }
        .popup-foot {
          padding: 8px 12px 12px;
          display: flex;
          justify-content: center;
        }
        .popup-ok {
          background: #18412a;
          color: white;
          border: none;
          height: 32px;
          padding: 0 18px;
          font-weight: 900;
          font-size: 13px;
          cursor: pointer;
        }

        .scroll-wrap { width: 100%; overflow-x: auto; }
        @media (max-width: 1150px) {
          .a4-page { width: 100%; margin: 0; box-shadow: none; }
          .scroll-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        }
